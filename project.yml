name: HeavenlyPad
options:
  bundleIdPrefix: com.antoine
packages:
  swift-atomics:
    url: https://github.com/apple/swift-atomics.git
    from: 1.2.0
targets:
  HeavenlyPad:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HeavenlyPad
      - path: rhpad.icon
    dependencies:
      - package: swift-atomics
        product: Atomics
    settings:
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: rhpad
      ENABLE_HARDENED_RUNTIME: YES
      INFOPLIST_KEY_LSMinimumSystemVersion: 14.0
      SWIFT_OBJC_BRIDGING_HEADER: "HeavenlyPad/CLibretro/include/libretro.h"
      HEADER_SEARCH_PATHS: "HeavenlyPad/CLibretro/include"
